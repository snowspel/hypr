# snow: copy / paste keys for kitty (install.sh copies this file to ~/.config/kitty/snow-keys.conf)
# Ctrl+C copies when text is selected; with nothing selected it still stops a running program (like normal).
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Middle mouse button pastes the text you selected with the mouse
mouse_map middle release ungrabbed paste_from_selection
